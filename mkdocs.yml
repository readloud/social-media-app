site_name: Social Media Auto-Schedule PWA
site_description: Production-ready social media scheduling platform
site_author: Development Team
site_url: https://docs.socialmedia.com

repo_name: social-media-app
repo_url: https://github.com/readloud/social-media-app
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mermaid2
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
  - macros
  - awesome-pages

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Quick Start: getting-started/quick-start.md
  - Architecture:
    - Overview: architecture/overview.md
    - Components: architecture/components.md
    - Data Flow: architecture/data-flow.md
    - Security: architecture/security.md
  - API Reference:
    - Authentication: api/authentication.md
    - Schedules: api/schedules.md
    - Posts: api/posts.md
    - Webhooks: api/webhooks.md
  - Deployment:
    - AWS Guide: deployment/aws.md
    - GCP Guide: deployment/gcp.md
    - Kubernetes: deployment/kubernetes.md
    - Docker: deployment/docker.md
  - Operations:
    - Monitoring: operations/monitoring.md
    - Backups: operations/backups.md
    - Disaster Recovery: operations/disaster-recovery.md
    - Scaling: operations/scaling.md
  - Security:
    - Compliance: security/compliance.md
    - Encryption: security/encryption.md
    - Auditing: security/auditing.md
  - Contributing:
    - Development Setup: contributing/setup.md
    - Code Style: contributing/code-style.md
    - Testing: contributing/testing.md
    - Pull Requests: contributing/pull-requests.md
  - FAQ: faq.md
  - Changelog: changelog.md