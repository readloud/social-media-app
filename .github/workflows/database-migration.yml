name: Database Migration

on:
  pull_request:
    paths:
      - 'backend/src/migrations/**'
      - 'backend/ormconfig.ts'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      migration_name:
        description: 'Migration name (optional)'
        required: false

jobs:
  test-migrations:
    name: Test Migrations
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: cd backend && npm ci
        
      - name: Run migrations
        run: |
          cd backend
          npm run migration:run
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          
      - name: Test rollback
        run: |
          cd backend
          npm run migration:revert
          npm run migration:run
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          
      - name: Verify schema
        run: |
          cd backend
          npm run migration:verify

  migrate-staging:
    name: Migrate Staging
    runs-on: ubuntu-latest
    needs: test-migrations
    if: github.event.inputs.environment == 'staging'
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ap-southeast-1
          
      - name: Run migration in staging
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster social-media-staging --service-name backend-service --query 'taskArns[0]' --output text)
          aws ecs execute-command \
            --cluster social-media-staging \
            --task $TASK_ARN \
            --container backend \
            --command "npm run migration:run" \
            --interactive
            
      - name: Create migration record
        run: |
          aws dynamodb put-item \
            --table-name migration-history \
            --item '{
              "migration_id": {"S": "${{ github.sha }}"},
              "timestamp": {"S": "'$(date -Iseconds)'"},
              "environment": {"S": "staging"},
              "status": {"S": "success"}
            }'

  migrate-production:
    name: Migrate Production
    runs-on: ubuntu-latest
    needs: [test-migrations, migrate-staging]
    if: github.event.inputs.environment == 'production'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create pre-migration backup
        run: |
          aws rds start-export-task \
            --export-task-id pre-migration-backup-$(date +%Y%m%d_%H%M%S) \
            --source-arn ${{ secrets.RDS_ARN }} \
            --s3-bucket-name social-media-backups
            
      - name: Run migration (maintenance mode)
        run: |
          # Enable maintenance mode
          aws ecs update-service \
            --cluster social-media-production \
            --service backend-service \
            --desired-count 0
          
          # Run migration
          TASK_ARN=$(aws ecs run-task --cluster social-media-production --task-definition migration-task --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_IDS }}],securityGroups=[${{ secrets.SECURITY_GROUP_ID }}],assignPublicIp=ENABLED}" --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --tasks $TASK_ARN
          
          # Check migration exit code
          EXIT_CODE=$(aws ecs describe-tasks --tasks $TASK_ARN --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi
          
          # Restore services
          aws ecs update-service \
            --cluster social-media-production \
            --service backend-service \
            --desired-count 3