name: Cleanup Resources

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

jobs:
  cleanup-artifacts:
    name: Clean GitHub Artifacts
    runs-on: ubuntu-latest
    
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const days = 14;
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            for (const artifact of artifacts.artifacts) {
              if (new Date(artifact.created_at) < cutoff) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                console.log(`Deleted artifact: ${artifact.name}`);
              }
            }
            
  cleanup-old-images:
    name: Clean Old Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Delete old container images
        uses: actions/github-script@v7
        with:
          script: |
            const days = 30;
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            
            const { data: packages } = await github.rest.packages.listPackagesForOrg({
              org: context.repo.owner,
              package_type: 'container',
            });
            
            for (const pkg of packages) {
              const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                org: context.repo.owner,
                package_type: 'container',
                package_name: pkg.name,
              });
              
              for (const version of versions) {
                if (new Date(version.created_at) < cutoff) {
                  await github.rest.packages.deletePackageVersionForOrg({
                    org: context.repo.owner,
                    package_type: 'container',
                    package_name: pkg.name,
                    package_version_id: version.id,
                  });
                  console.log(`Deleted version: ${version.name}`);
                }
              }
            }
            
  cleanup-logs:
    name: Clean CloudWatch Logs
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ap-southeast-1
          
      - name: Delete old log groups
        run: |
          aws logs describe-log-groups --query 'logGroups[?starts_with(logGroupName, `/aws/ecs/social-media`)]' | \
            jq -r '.[].logGroupName' | while read LOG_GROUP; do
              # Delete logs older than 30 days
              aws logs delete-log-group --log-group-name $LOG_GROUP
            done
            
  cleanup-old-backups:
    name: Clean Old Backups
    runs-on: ubuntu-latest
    
    steps:
      - name: Delete old RDS snapshots
        run: |
          aws rds describe-db-snapshots \
            --query 'DBSnapshots[?SnapshotCreateTime<=`$(date -d "30 days ago" +%Y-%m-%d)`].[DBSnapshotIdentifier]' \
            --output text | while read SNAPSHOT; do
              aws rds delete-db-snapshot --db-snapshot-identifier $SNAPSHOT
            done