name: On-Demand Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - rollback
          - scale-service
          - run-query
          - clear-cache
          - rotate-secrets
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      service:
        description: 'Service name (for scale operations)'
        required: false
        type: string
      replicas:
        description: 'Number of replicas (for scale operations)'
        required: false
        type: number
        default: 3

jobs:
  rollback:
    name: Rollback Deployment
    if: github.event.inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ap-southeast-1
          
      - name: Get previous task definition
        run: |
          PREVIOUS_TD=$(aws ecs describe-services \
            --cluster social-media-${{ github.event.inputs.environment }} \
            --services backend-service \
            --query 'services[0].taskDefinition' \
            --output text)
            
          aws ecs update-service \
            --cluster social-media-${{ github.event.inputs.environment }} \
            --service backend-service \
            --task-definition $PREVIOUS_TD \
            --force-new-deployment
            
      - name: Invalidate cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
            
      - name: Notify rollback complete
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "⚠️ Rollback completed for ${{ github.event.inputs.environment }}\nTriggered by: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  scale-service:
    name: Scale Service
    if: github.event.inputs.operation == 'scale-service'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ap-southeast-1
          
      - name: Scale service
        run: |
          aws ecs update-service \
            --cluster social-media-${{ github.event.inputs.environment }} \
            --service ${{ github.event.inputs.service }}-service \
            --desired-count ${{ github.event.inputs.replicas }}
            
          echo "✅ Scaled ${{ github.event.inputs.service }} to ${{ github.event.inputs.replicas }} replicas"

  clear-cache:
    name: Clear Cache
    if: github.event.inputs.operation == 'clear-cache'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Clear Redis cache
        run: |
          redis-cli -h ${{ secrets.REDIS_HOST }} -a ${{ secrets.REDIS_PASSWORD }} FLUSHALL
          
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
            
      - name: Clear CDN cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'